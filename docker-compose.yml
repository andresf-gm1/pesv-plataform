version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fleet-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_secure_password
      POSTGRES_DB: fleet_command
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fleet_command"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s # Dar tiempo a PostgreSQL para iniciar
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: fleet-server
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - TRACCAR_URL=${TRACCAR_URL}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}

volumes:
  postgres_data: