name: CD - Deploy to Remote Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navegar al directorio del proyecto
            cd /home/${{ secrets.REMOTE_USER }}/mi-sistema

            # Actualizar el código fuente
            git pull origin main

            # Crear/Actualizar el archivo .env de producción
            echo "NODE_ENV=production" > .env
            echo "PORT=3000" >> .env
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }}" >> .env
            echo "TRACCAR_URL=${{ secrets.TRACCAR_URL }}" >> .env
            echo "MAIL_HOST=${{ secrets.MAIL_HOST }}" >> .env
            echo "MAIL_USER=${{ secrets.MAIL_USER }}" >> .env
            echo "MAIL_PASS=${{ secrets.MAIL_PASS }}" >> .env
            echo "TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}" >> .env
            echo "TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}" >> .env
            echo "TWILIO_WHATSAPP_NUMBER=${{ secrets.TWILIO_WHATSAPP_NUMBER }}" >> .env
            echo "SALES_EMAIL=${{ secrets.SALES_EMAIL }}" >> .env

            # Generar cliente Prisma dentro del contenedor (si es necesario) y reiniciar
            # docker-compose build --no-cache app
            
            # Reiniciar servicios
            docker-compose down
            docker-compose up -d --build

            # Limpieza de imágenes antiguas para ahorrar espacio
            docker image prune -f