services:
  - type: web
    name: fleet-command-pesv-api
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: PUBLIC_BASE_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MAPTILER_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
