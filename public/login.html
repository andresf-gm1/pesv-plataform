<!DOCTYPE html>
<html lang="es"> 
<head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title>Ingreso - Flota PESV</title>   <link rel="stylesheet" href="styles.css?v=20260518ux4">   <script src="/runtime-config.js"></script>
</head> 
<body class="login-page">   <main class="login-shell">     <section class="login-brand">       <p class="eyebrow">Acceso SaaS multiempresa</p>       <h1>Monitoreo GPS y PESV inteligente para equipos de transporte</h1>       <p>Controla flota, novedades críticas, documentos, inspecciones, permisos y evidencia operacional desde una sola plataforma.</p>       <div class="login-links">         <a href="/">Landing</a>         <a href="/demo">Probar demo</a>         <a href="/app">App móvil</a>       </div>     </section>     <section class="login-card">       <h2>Ingresar</h2>       <form id="loginForm">         <label>Correo</label>         <input id="email" type="email" autocomplete="username" required>         <label>Clave</label>         <input id="password" type="password" value="Admin123" required>         <button class="primary-btn" type="submit">Entrar</button>         <p id="loginError" class="form-error"></p>       </form>       <div class="demo-users">         <strong>Accesos de prueba</strong>         <button type="button" onclick="fillDemo('admin@demo.com','Admin123')">Administrador demo</button>         <button type="button" onclick="fillDemo('supervisor@demo.com','Supervisor123')">Supervisor demo</button>         <button type="button" onclick="fillDemo('auditor@demo.com','Auditor123')">Auditor PESV demo</button>         <button type="button" onclick="fillDemo('conductor@demo.com','Ambulancia123')">Conductor demo</button>       </div>     </section>   </main>   <script>     document.getElementById("loginForm").addEventListener("submit", async (event) => {       event.preventDefault();       const loginError = document.getElementById("loginError");       loginError.textContent = "";       const response = await fetch("/api/auth/login", {         method: "POST",         headers: { "Content-Type": "application/json" },         body: JSON.stringify({           email: document.getElementById("email").value,           password: document.getElementById("password").value         })       });       const result = await response.json();       if (!response.ok) {         loginError.textContent = result.message || "No se pudo iniciar sesion";         return;       }       localStorage.setItem("token", result.token);       localStorage.setItem("user", JSON.stringify(result.user));       localStorage.setItem("company", JSON.stringify(result.company));       window.location.href = "/dashboard";     });     function fillDemo(email, password) {       document.getElementById("email").value = email;       document.getElementById("password").value = password;     }   </script> 
</body> 
</html>
