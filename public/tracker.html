<!DOCTYPE html>
<html lang="es"> 
<head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title>GPS Propio - Flota PESV</title>   <link rel="stylesheet" href="styles.css?v=20260518ux4">   <script src="/runtime-config.js"></script>
</head> 
<body>   <script src="auth.js"></script>   <script>     requireAuth();     renderTopbar("tracker");   </script>   <main class="page-shell">     <section class="page-heading">       <p class="eyebrow">Cliente GPS propio</p>       <h1>Enviar ubicación a la plataforma</h1>       <p>Esta pantalla permite registrar ubicación sin usar Traccar. En celular debe abrirse por HTTPS para que el navegador permita GPS.</p>     </section>     <section class="dashboard-grid">       <article class="panel">         <h2>Seguimiento</h2>         <div class="detail-metrics">           <div><strong id="gpsStatus">Detenido</strong><span>Estado</span></div>           <div><strong id="gpsCount">0</strong><span>Puntos enviados</span></div>           <div><strong id="gpsLat">-</strong><span>Latitud</span></div>           <div><strong id="gpsLon">-</strong><span>Longitud</span></div>         </div>         <button class="primary-btn" onclick="startTracking()">Iniciar envío GPS</button>         <button class="secondary-btn full-btn" onclick="stopTracking()">Detener</button>         <p id="gpsMessage" class="form-error"></p>       </article>       <article class="panel">         <h2>Exportar ruta propia</h2>         <label>Desde           <input type="datetime-local" id="fromDate">         </label>         <label>Hasta           <input type="datetime-local" id="toDate">         </label>         <div class="export-actions">           <button class="secondary-btn" onclick="downloadRoute('csv')">CSV</button>           <button class="secondary-btn" onclick="downloadRoute('kml')">KML</button>           <button class="secondary-btn" onclick="downloadRoute('geojson')">GeoJSON/QGIS</button>         </div>       </article>     </section>   </main>   <script>     let watchId = null;     let sent = 0;     function startTracking() {       const message = document.getElementById("gpsMessage");       message.textContent = "";       if (!navigator.geolocation) {         message.textContent = "Este navegador no soporta geolocalización.";         return;       }       document.getElementById("gpsStatus").textContent = "Enviando";       watchId = navigator.geolocation.watchPosition(async (position) => {         const payload = {           latitude: position.coords.latitude,           longitude: position.coords.longitude,           accuracy: position.coords.accuracy,           speed: position.coords.speed || 0,           heading: position.coords.heading || 0,           activity: "seguimiento"         };         const response = await apiFetch("/api/location/ping", {           method: "POST",           body: JSON.stringify(payload)         });         if (response && response.ok) {           sent++;           document.getElementById("gpsCount").textContent = sent;           document.getElementById("gpsLat").textContent = payload.latitude.toFixed(6);           document.getElementById("gpsLon").textContent = payload.longitude.toFixed(6);         }       }, (error) => {         document.getElementById("gpsMessage").textContent = error.message;         document.getElementById("gpsStatus").textContent = "Error";       }, {         enableHighAccuracy: true,         maximumAge: 5000,         timeout: 15000       });     }     function stopTracking() {       if (watchId !== null) {         navigator.geolocation.clearWatch(watchId);         watchId = null;       }       document.getElementById("gpsStatus").textContent = "Detenido";     }     function downloadRoute(format) {       const from = document.getElementById("fromDate").value;       const to = document.getElementById("toDate").value;       const params = new URLSearchParams({         format,         token: getToken()       });       if (from) params.set("from", new Date(from).toISOString());       if (to) params.set("to", new Date(to).toISOString());       window.open(`/api/routes/personal?${params.toString()}`, "_blank");     }   </script> 
</body> 
</html>
