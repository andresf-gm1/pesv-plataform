<!DOCTYPE html>
<html lang="es"> 
<head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0">   <title>Usuarios - Flota PESV</title>   <link rel="stylesheet" href="styles.css?v=20260518ux4">   <script src="/runtime-config.js"></script>
</head> 
<body>   <script src="auth.js"></script>   <script>     requireAuth();     renderTopbar("usuarios");   </script>   <main class="page-shell">     <section class="page-heading">       <p class="eyebrow">Administracion</p>       <h1>Usuarios de la empresa</h1>       <p>Crea accesos para administradores, supervisores y conductores. Para la demo puedes entregar correo y clave directamente.</p>     </section>     <section class="dashboard-grid">       <form id="userForm" class="panel">         <h2>Crear usuario</h2>         <label>Nombre           <input id="name" type="text" required>         </label>         <label>Correo           <input id="email" type="email" required>         </label>         <label>Rol           <select id="role">             <option value="conductor">Conductor</option>             <option value="supervisor">Supervisor</option>             <option value="admin">Administrador</option>           </select>         </label>         <label>Clave temporal           <input id="password" type="text" value="Temporal123" required>         </label>         <button class="primary-btn" type="submit">Crear usuario</button>         <p id="userMessage" class="form-error"></p>       </form>       <section class="panel">         <h2>Usuarios activos</h2>         <div id="usersList" class="users-list"></div>       </section>     </section>   </main>   <script>     cargarUsuarios();     document.getElementById("userForm").addEventListener("submit", async (event) => {       event.preventDefault();       const message = document.getElementById("userMessage");       message.textContent = "";       const payload = {         name: document.getElementById("name").value,         email: document.getElementById("email").value,         role: document.getElementById("role").value,         password: document.getElementById("password").value       };       const response = await apiFetch("/api/users", {         method: "POST",         body: JSON.stringify(payload)       });       const result = await response.json();       if (!response.ok) {         message.textContent = result.message || "No se pudo crear el usuario";         return;       }       message.style.color = "#16a34a";       message.textContent = `Usuario creado. Entrega: ${payload.email} / ${payload.password}`;       document.getElementById("userForm").reset();       document.getElementById("password").value = "Temporal123";       cargarUsuarios();     });     async function cargarUsuarios() {       const response = await apiFetch("/api/users");       const users = await response.json();       const list = document.getElementById("usersList");       list.innerHTML = "";       users.forEach(user => {         list.insertAdjacentHTML("beforeend", `           <article class="user-row">             <div>               <strong>${user.name}</strong>               <span>${user.email}</span>             </div>             <span>${user.role}</span>           </article>         `);       });     }   </script> 
</body> 
</html>
